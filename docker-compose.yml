services:
  backend:
    image: ghcr.io/rzv1/cvbuilder-backend:latest
    container_name: cvbuilder-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATABASE_URL=file:/app/prisma/file-data/dev.db
    volumes:
      - ./backend/prisma/file-data:/app/prisma/file-data
    networks:
      - proxy-network
      - internal-net

  frontend:
    image: ghcr.io/rzv1/cvbuilder-frontend:latest
    container_name: cvbuilder-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - proxy-network
      - internal-net

networks:
  proxy-network:
    external: true
  internal-net:
    driver: bridge
